services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adega
      POSTGRES_PASSWORD: adega_secret
      POSTGRES_DB: adega
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adega -d adega"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://adega:adega_secret@postgres:5432/adega
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: change-me-in-production
      PUBLIC_DOMAIN: localhost:3000
      R2_ENDPOINT: ""
      R2_ACCESS_KEY: ""
      R2_SECRET_KEY: ""
      R2_BUCKET: "adega-media"
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL_INTERNAL: http://api:8000
      NEXT_PUBLIC_ADMIN_TOKEN_HINT: "Use ADMIN_TOKEN from compose"
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
